name: Word of the Day

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  word-of-the-day:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate word entries
        run: |
          python3 << 'PYEOF'
          import json
          import urllib.request
          import time
          from datetime import datetime, timedelta, timezone
          import os

          WORDS = [
            "serendipity","ephemeral","eloquent","resilience","ambiguous",
            "persevere","intricate","benevolent","pragmatic","melancholy",
            "tenacious","versatile","meticulous","luminous","profound",
            "ardent","candid","diligent","enigmatic","fervent",
            "gracious","humble","innovative","jubilant","kinetic",
            "lucid","meander","nuance","obsolete","pensive",
            "quaint","radiant","serene","tranquil","ubiquitous",
            "vivid","whimsical","xenial","yearning","zealous",
            "aberrant","blithe","cacophony","daunting","ebullient",
            "facetious","garrulous","halcyon","impeccable","jubilee",
            "keen","loquacious","mundane","nonchalant","opulent",
            "placid","querulous","reticent","sagacious","tenuous",
            "umbrage","verbose","wistful","xenophile","yonder",
            "zeal","acumen","brevity","cognizant","deft",
            "empathy","fortitude","gratitude","harmony","integrity"
          ]
          WORD_COUNT = len(WORDS)
          FILE = "WORD-OF-THE-DAY.md"

          # Read existing content
          if os.path.exists(FILE):
              with open(FILE, "r") as f:
                  existing = f.read()
          else:
              existing = ""

          added = 0

          # Check last 7 days + today (index 6 = oldest, 0 = today)
          for i in range(6, -1, -1):
              check_date = (datetime.now(timezone.utc) - timedelta(days=i)).strftime("%Y-%m-%d")

              # Duplicate check
              if f"### \U0001f4c5 {check_date}" in existing:
                  print(f"OK {check_date} already exists, skipping")
                  continue

              print(f"Adding entry for {check_date}...")

              # Pick word by day of year so same date always gets same word
              day_num = int((datetime.strptime(check_date, "%Y-%m-%d")).strftime("%j"))
              index = (day_num - 1) % WORD_COUNT
              selected_word = WORDS[index]

              # Fetch from Free Dictionary API
              try:
                  url = f"https://api.dictionaryapi.dev/api/v2/entries/en/{selected_word}"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.loads(response.read().decode())
                  word       = data[0]["word"]
                  phonetic   = data[0].get("phonetic", "N/A")
                  word_type  = data[0]["meanings"][0]["partOfSpeech"]
                  definition = data[0]["meanings"][0]["definitions"][0]["definition"]
                  example    = data[0]["meanings"][0]["definitions"][0].get("example", "No example available.")
              except Exception as e:
                  print(f"API error for {selected_word}: {e}, using fallback")
                  word, phonetic, word_type = selected_word, "N/A", "N/A"
                  definition, example = "Definition temporarily unavailable.", "No example available."

              # Build entry with emojis via unicode escapes (safe in YAML)
              cal    = "\U0001f4c5"
              book   = "\U0001f4d6"
              sound  = "\U0001f50a"
              label  = "\U0001f3f7\ufe0f"
              pencil = "\U0001f4dd"
              bubble = "\U0001f4ac"

              lines = [
                  "",
                  "<hr/>",
                  "",
                  f"### {cal} {check_date}",
                  f"## {book} {word}",
                  f"- {sound} **Pronunciation:** {phonetic}",
                  f"- {label} **Type:** {word_type}",
                  f"- {pencil} **Definition:** {definition}",
                  f"- {bubble} **Example:** *{example}*",
                  "",
              ]
              entry = "\n".join(lines)

              with open(FILE, "a") as f:
                  f.write(entry)

              existing += entry
              added += 1

              # Avoid API rate limiting
              if i > 0:
                  time.sleep(2)

          print(f"Done. {added} new entries added.")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "vishal-git-dot"
          git config user.email "214489076+vishal-git-dot@users.noreply.github.com"
          git add WORD-OF-THE-DAY.md
          if git diff --cached --quiet; then
            echo "Nothing new to commit, already up to date."
          else
            git commit -m "Word of the Day $(date '+%Y-%m-%d')"
            git push
          fi
